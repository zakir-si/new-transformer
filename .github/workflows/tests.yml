name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install "torch>=2.5" "pytest>=7.0"
      - run: python scripts/smoke_test.py
      - run: pytest -q
      - run: python scripts/benchmark.py --device cpu --seq-lens 16 --batch-size 1 --dim 32 --q-heads 4 --kv-heads 4,2,1 --implementations native,expand --warmup 1 --repeats 3 --output ci_benchmark.jsonl
